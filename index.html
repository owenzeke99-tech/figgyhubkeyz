
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figgy Hub Key</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 background:#090611;
 color:white;
 font-family:Inter,sans-serif;
}

.bg{
 position:fixed;
 inset:0;
 background:
 radial-gradient(ellipse at 15% 20%,#8b32d933,transparent 40%),
 radial-gradient(ellipse at 85% 80%,#c026d322,transparent 45%),
 linear-gradient(145deg,#090611,#130b20,#080611);
}

.glow{
 position:fixed;
 width:280px;
 height:280px;
 border-radius:50%;
 background:#a855f7;
 filter:blur(120px);
 opacity:.2;
 animation:glowMove 8s ease-in-out infinite alternate;
}
.glow.one{top:-100px;left:-100px}
.glow.two{bottom:-120px;right:-100px;background:#d946ef}

@keyframes glowMove{
 to{transform:translate(100px,80px) scale(1.3)}
}

#fx{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
}

/* MENU */
.card{
 width:90%;
 max-width:425px;
 padding:36px 27px;
 position:relative;
 z-index:5;
 text-align:center;
 border-radius:27px;
 background:rgba(20,13,32,.9);
 backdrop-filter:blur(22px);
 border:1px solid #a855f755;
 box-shadow:0 20px 80px #0009,0 0 45px #a855f725;
 animation:cardIn .9s ease,cardFloat 5s ease-in-out 1s infinite;
}

@keyframes cardIn{
 from{opacity:0;transform:translateY(35px) scale(.94)}
 to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes cardFloat{
 0%,100%{translate:0 0}
 50%{translate:0 -6px}
}

/* LIGHT BORDER */
.card:before{
 content:"";
 position:absolute;
 inset:-1px;
 padding:1.5px;
 border-radius:28px;
 background:linear-gradient(135deg,#a855f7,#f0d9ff,#7136c9,#e879f9,#a855f7);
 background-size:250% 250%;
 animation:borderGlow 6s ease-in-out infinite alternate;
 -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
 -webkit-mask-composite:xor;
 mask-composite:exclude;
 pointer-events:none;
}

@keyframes borderGlow{
 from{background-position:0% 50%;opacity:.6}
 to{background-position:100% 50%;opacity:1}
}

/* SOFT LIGHT INSIDE MENU */
.card:after{
 content:"";
 position:absolute;
 inset:0;
 border-radius:27px;
 background:linear-gradient(115deg,transparent 30%,#ffffff0b 50%,transparent 70%);
 background-size:250% 100%;
 animation:lightSweep 8s linear infinite;
 pointer-events:none;
}

@keyframes lightSweep{
 to{background-position:-250% 0}
}

/* GARLIC LOGO */
.logo{
 width:110px;
 height:110px;
 position:relative;
 margin:0 auto 20px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:radial-gradient(circle,#a855f728,transparent 70%);
}

.logo:before{
 content:"";
 position:absolute;
 width:75px;
 height:75px;
 background:#a855f7;
 filter:blur(35px);
 opacity:.4;
 animation:logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow{
 from{transform:scale(.8);opacity:.2}
 to{transform:scale(1.3);opacity:.55}
}

.garlic-svg{
 width:78px;
 height:90px;
 position:relative;
 z-index:2;
 filter:drop-shadow(0 5px 13px #b66aff88);
 animation:garlicFloat 3s ease-in-out infinite;
}

@keyframes garlicFloat{
 0%,100%{transform:translateY(0) rotate(-3deg)}
 50%{transform:translateY(-7px) rotate(3deg)}
}

/* TITLE */
h1{
 font-size:33px;
 font-weight:900;
 letter-spacing:-1.5px;
 background:linear-gradient(90deg,#fff,#d8b4fe,#a855f7,#fff);
 background-size:250%;
 background-clip:text;
 -webkit-background-clip:text;
 color:transparent;
 animation:titleShine 5s linear infinite;
}
@keyframes titleShine{to{background-position:250%}}

.subtitle{
 margin-top:9px;
 font-size:12px;
 color:#a99ab9;
 letter-spacing:.7px;
}

/* STATUS */
.status{
 display:inline-flex;
 align-items:center;
 gap:9px;
 margin:24px 0;
 padding:9px 17px;
 border-radius:30px;
 background:#a855f71a;
 border:1px solid #b46cff77;
 color:#dfc0ff;
 font-size:10px;
 font-weight:800;
 letter-spacing:1.5px;
 animation:statusGlow 2s infinite alternate;
}
.dot{
 width:7px;height:7px;
 border-radius:50%;
 background:#c084fc;
 box-shadow:0 0 12px #c084fc;
 animation:dotPulse 1.2s infinite;
}
@keyframes dotPulse{
 50%{opacity:.25;transform:scale(.65)}
}
@keyframes statusGlow{
 to{box-shadow:0 0 20px #a855f744}
}

/* KEY MENU */
.key-section{text-align:left}

.key-label{
 font-size:11px;
 font-weight:800;
 letter-spacing:1.5px;
 color:#c4b5d9;
 margin-bottom:11px;
}

.key-box{
 position:relative;
 padding:16px;
 border-radius:13px;
 overflow:hidden;
 background:linear-gradient(120deg,#100a1a,#170e25);
 border:1px solid #9957db;
 box-shadow:inset 0 0 18px #a855f722;
 animation:keyGlow 3s ease-in-out infinite alternate;
 transition:.3s;
}

@keyframes keyGlow{
 from{box-shadow:inset 0 0 10px #a855f710}
 to{box-shadow:inset 0 0 25px #a855f744,0 0 15px #a855f722}
}

.key-box:before{
 content:"";
 position:absolute;
 top:0;
 left:-100%;
 width:100%;
 height:2px;
 background:linear-gradient(90deg,transparent,#e9d5ff,transparent);
 animation:keyLine 3s linear infinite;
}
@keyframes keyLine{to{left:100%}}

.key-box:hover{
 border-color:#e9d5ff;
 transform:translateY(-2px);
}

#key{
 color:#dfc1ff;
 font-size:12px;
 font-weight:600;
 line-height:1.7;
 overflow-wrap:anywhere;
}

/* COPY BUTTON */
.copy-btn{
 width:100%;
 margin-top:18px;
 padding:16px;
 position:relative;
 overflow:hidden;
 border:1px solid #d8b4fe77;
 border-radius:13px;
 color:white;
 background:linear-gradient(110deg,#7026c9,#b04cff,#792ed3);
 background-size:200%;
 font-size:13px;
 font-weight:900;
 letter-spacing:1.5px;
 cursor:pointer;
 box-shadow:0 5px 25px #8b3de855;
 transition:.3s;
 animation:buttonGradient 4s linear infinite;
}

@keyframes buttonGradient{to{background-position:200%}}

.copy-btn:before{
 content:"";
 position:absolute;
 width:45%;
 height:100%;
 top:0;
 left:-70%;
 transform:skewX(-25deg);
 background:linear-gradient(90deg,transparent,#fff8,transparent);
 animation:buttonShine 3s infinite;
}
@keyframes buttonShine{to{left:140%}}

.copy-btn:hover{
 transform:translateY(-4px);
 box-shadow:0 10px 35px #a855f788;
}
.copy-btn:active{transform:scale(.96)}
.copy-btn span{position:relative;z-index:1}

.footer{
 margin-top:25px;
 font-size:10px;
 color:#81758f;
 letter-spacing:1.2px;
}

@media(max-width:390px){
 .card{padding:30px 20px}
 h1{font-size:29px}
}

@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="bg"></div>
<div class="glow one"></div>
<div class="glow two"></div>
<canvas id="fx"></canvas>

<div class="card">

 <div class="logo">
  <svg class="garlic-svg" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#fff"/>
     <stop offset=".45" stop-color="#ead7ff"/>
     <stop offset="1" stop-color="#9560c8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#e9d5ff"/>
     <stop offset="1" stop-color="#7136a7"/>
    </linearGradient>
   </defs>
   <path d="M49 26 Q40 14 44 4 Q50 12 53 0 Q59 12 54 28"
    fill="url(#leaf)" stroke="#d8b4fe" stroke-width="1.5"/>
   <path d="M49 25 C32 22 18 34 14 49 C6 69 22 94 49 104 C77 94 94 69 86 49 C80 32 65 22 49 25Z"
    fill="url(#skin)" stroke="#f3e8ff" stroke-width="2"/>
   <path d="M49 27 C36 40 36 73 49 104 C62 73 62 40 49 27Z"
    fill="#fff" opacity=".62" stroke="#b98bd9" stroke-width="1.5"/>
   <path d="M34 31 C22 46 23 75 42 96 C35 69 39 45 49 27"
    fill="#d9b6f3" opacity=".75"/>
   <path d="M65 31 C78 46 76 75 56 96 C64 69 60 45 49 27"
    fill="#b78bd9" opacity=".6"/>
   <path d="M22 48 Q14 67 34 85" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
   <path d="M76 48 Q86 67 65 85" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
   <path d="M49 104 L49 111" stroke="#d8b4fe" stroke-width="3" stroke-linecap="round"/>
   <ellipse cx="32" cy="43" rx="7" ry="4" fill="#fff" opacity=".6"/>
  </svg>
 </div>

 <h1>Figgy Hub</h1>
 <p class="subtitle">Welcome to Figgy Hub Key System</p>

 <div class="status">
  <span class="dot"></span>
  KEY AVAILABLE
 </div>

 <div class="key-section">
  <div class="key-label">YOUR ACCESS KEY</div>
  <div class="key-box">
   <span id="key">FiggyHubKeyJdkehKalowwjLalwhjwiwBskwowi</span>
  </div>
 </div>

 <button class="copy-btn" onclick="copyKey()">
  <span id="buttonText">✦ COPY KEY ✦</span>
 </button>

 <p class="footer">FIGGY HUB © 2026 · ALL RIGHTS RESERVED</p>
</div>

<script>
// COPY KEY
function copyKey(){
 const key=document.getElementById("key").innerText;
 const txt=document.getElementById("buttonText");

 function done(){
  txt.innerText="✓ COPIED SUCCESSFULLY!";
  setTimeout(()=>txt.innerText="✦ COPY KEY ✦",2000);
 }

 if(navigator.clipboard && window.isSecureContext){
  navigator.clipboard.writeText(key).then(done).catch(()=>fallback(key,done));
 }else fallback(key,done);
}

function fallback(key,done){
 const input=document.createElement("textarea");
 input.value=key;
 document.body.appendChild(input);
 input.select();
 try{
  document.execCommand("copy");
  done();
 }catch(e){
  document.getElementById("buttonText").innerText="COPY FAILED";
 }
 input.remove();
}

// FALLING SNOW + PARTICLES
const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
let particles=[];

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

for(let i=0;i<110;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+0.5,
  speed:Math.random()*.8+.2,
  alpha:Math.random()*.7+.2,
  drift:(Math.random()-.5)*.6,
  snow:Math.random()>.65
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 particles.forEach(p=>{
  p.y+=p.snow?p.speed:p.speed*.35;
  p.x+=p.drift;

  if(p.y>canvas.height+5){
   p.y=-5;
   p.x=Math.random()*canvas.width;
  }
  if(p.x<0)p.x=canvas.width;
  if(p.x>canvas.width)p.x=0;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle=`rgba(211,170,255,${p.alpha})`;
  ctx.shadowBlur=12;
  ctx.shadowColor="#b66aff";
  ctx.fill();
 });

 requestAnimationFrame(draw);
}
draw();

// FLOATING FIREFLIES
const symbols=["✦","✧","·","❄","✴","⋆"];

function createSymbol(){
 const s=document.createElement("span");
 s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
 s.style.cssText=`
 position:fixed;
 z-index:1;
 left:${Math.random()*100}vw;
 top:105vh;
 color:#e9d5ff;
 font-size:${8+Math.random()*17}px;
 pointer-events:none;
 text-shadow:0 0 12px #a855f7;
 animation:floatUp ${5+Math.random()*5}s linear forwards;
 `;
 document.body.appendChild(s);
 setTimeout(()=>s.remove(),11000);
}

const style=document.createElement("style");
style.textContent=`
@keyframes floatUp{
 0%{transform:translateY(0) rotate(0) scale(.5);opacity:0}
 15%{opacity:1}
 100%{transform:translateY(-120vh) rotate(240deg) scale(1.4);opacity:0}
}`;
document.head.appendChild(style);

setInterval(createSymbol,300);
</script>
</body>
</html>
